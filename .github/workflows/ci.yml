name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'

  benchmark-smoke:
    # Proves the JMH harness compiles and runs. Numbers from shared CI runners are noise,
    # so this is a smoke test only; real results live in docs/performance.md.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package benchmarks
        run: mvn -B -ntp -DskipTests package
      - name: Run one short benchmark
        run: java -jar engine-benchmarks/target/benchmarks.jar OrderBookBenchmark.restNonCrossing -f 1 -wi 1 -i 1 -w 1s -r 1s
